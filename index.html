<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>江湖師徒手冊</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#292925;--muted:#898984;--gold:#ad8748;--goldbg:#f4efe6;--border:#e7e5df;--soft:#f0f3f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:740px;margin:auto;padding:22px 15px 45px}.top{display:flex;gap:12px;align-items:center;margin-bottom:18px}.seal{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);background:white;color:var(--gold);font-size:22px}.eyebrow,.kicker{font-size:11px;letter-spacing:.15em;color:var(--gold);font-weight:750}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0}.sub,.small{font-size:12px;color:var(--muted)}.card{background:white;border:1px solid var(--border);border-radius:20px;padding:18px;margin:13px 0}.hero{background:#f0ede7;border-color:#ddcba9}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.pill{border:1px solid #ddcba9;background:#faf7f1;color:#8b6b35;padding:4px 10px;border-radius:99px;font-size:12px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.stat{background:white;border:1px solid var(--border);border-radius:15px;padding:12px}.stat .num{font-size:22px;font-weight:750}.stat .label{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab,.btn{border:1px solid var(--border);border-radius:99px;padding:9px 14px;background:white;color:#777;white-space:nowrap;cursor:pointer}.tab.active{border-color:var(--gold);background:#fbf8f2;color:var(--gold);font-weight:700}.btn{border-radius:11px;padding:9px 13px}.btn.primary{background:var(--gold);border-color:var(--gold);color:white}.btn.ghost{background:white}.section{display:none}.section.active{display:block}.progress{height:7px;background:#ece9e2;border-radius:99px;overflow:hidden;margin:10px 0 5px}.progress div{height:100%;background:var(--gold);width:0;transition:width .2s}.list{display:grid;gap:8px;margin-top:13px}.task{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid #efeee9;border-radius:13px}.task input{appearance:none;width:19px;height:19px;flex:0 0 19px;margin:3px 0 0;border:1.5px solid #d5d4ce;border-radius:50%;cursor:pointer}.task input:checked{background:var(--gold);border-color:var(--gold)}.task input:checked:after{content:"✓";display:block;color:white;text-align:center;font-size:13px;font-weight:bold}.task .name{flex:1;overflow-wrap:anywhere}.task.done .name{text-decoration:line-through;color:#9b9b95}.icon{border:0;background:transparent;color:#aaa;font-size:18px;cursor:pointer}.add{display:flex;gap:8px;margin-top:12px}input[type=text],textarea,select{font:inherit;min-width:0;border:1px solid var(--border);border-radius:11px;background:#fff;color:#292925;outline:none}input[type=text],textarea{width:100%;padding:10px 12px}input[type=text]::placeholder,textarea::placeholder{color:#898984;opacity:1}textarea{min-height:82px;resize:vertical}.reminder{padding:13px;background:#f8f6f1;border:1px solid #eee5d4;border-radius:14px;margin:8px 0;overflow-wrap:anywhere}.reminderhead{display:flex;justify-content:space-between;gap:10px}.reminderbody{white-space:pre-wrap;color:#77756f;font-size:13px;margin-top:4px}.form{display:grid;gap:8px;margin-top:12px}.empty{padding:18px;text-align:center;border:1px dashed var(--border);border-radius:13px;color:var(--muted);font-size:13px}.footer{text-align:center;color:#a09f99;font-size:12px;margin-top:22px}.hint{font-size:12px;color:var(--muted)}@media(min-width:600px){.page{padding-top:30px}.card{padding:21px}}@media(max-width:400px){h1{font-size:23px}.card{padding:15px}.stats{gap:6px}.stat{padding:10px}.stat .num{font-size:19px}}
</style></head><body><main class="page">
<header class="top"><div class="seal">執</div><div><div class="eyebrow">江湖日常 · 師徒同行</div><h1>江湖師徒手冊</h1><div class="sub">把必做之事記下，把江湖日子過好。</div></div></header>
<section class="card hero"><div class="head"><div><div class="kicker">門派備忘</div><h2>今日行走江湖，別忘了這些</h2></div><span class="pill" id="today"></span></div><div style="color:#77756f;font-size:14px">寫也不知道你們用不用得上，就是一個小備忘錄。</div></section>
<div class="stats" style="grid-template-columns:1fr"><div class="stat"><div class="label">今日已完成</div><div class="num" id="doneStat">0 / 3</div></div></div>
<nav class="tabs"><button class="tab active" type="button">每日必做</button></nav>
<section class="section active" id="daily"><div class="card"><div class="head"><div><div class="kicker">DAILY CHECKLIST</div><h2>每日必做</h2></div><button class="btn ghost" id="reset">重置今日</button></div><div class="small">完成後打勾即可；勾選狀態會保存在目前的裝置。</div><div class="progress"><div id="dailyBar"></div></div><div class="small" id="dailyPct"></div><div class="list" id="dailyList"></div><div class="add"><input id="dailyInput" type="text" placeholder="新增每日事項"><button class="btn primary" id="addDaily">新增</button></div></div></section>
<div class="footer">願你此去江湖，任務不漏，修行有成。<br>江湖師徒手冊 · 本機自動保存</div></main>
<script>
const KEY="jianghu_handbook_personal_v1";
const now=new Date();
const day=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
document.getElementById("today").textContent=(now.getMonth()+1)+"/"+now.getDate();
function id(){return Math.random().toString(36).slice(2,10)}
const fixedNames=["切磋","門派切磋","成章"];
const defaults={daily:fixedNames.map(text=>({id:id(),text,done:false,fixed:true})),day};
function load(){
  try{
    const old=JSON.parse(localStorage.getItem(KEY));
    if(!old) return {...defaults,daily:defaults.daily.map(x=>({...x}))};
    let tasks=Array.isArray(old.daily)?old.daily:[];
    fixedNames.forEach(text=>{
      const found=tasks.find(t=>t.text===text);
      if(found){found.fixed=true}else{tasks.unshift({id:id(),text,done:false,fixed:true})}
    });
    tasks.forEach(t=>{if(fixedNames.includes(t.text))t.fixed=true});
    if(old.day!==day) tasks=tasks.map(t=>({...t,done:fixedNames.includes(t.text)?false:t.done}));
    tasks.sort((a,b)=>{
      const ai=fixedNames.indexOf(a.text),bi=fixedNames.indexOf(b.text);
      if(ai<0&&bi<0)return 0;if(ai<0)return 1;if(bi<0)return -1;return ai-bi;
    });
    return {daily:tasks,day};
  }catch(e){return {...defaults,daily:defaults.daily.map(x=>({...x}))}}
}
let data=load();
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function taskList(){
 const root=document.getElementById("dailyList");root.innerHTML="";
 data.daily.forEach((t,i)=>{
   const el=document.createElement("div");el.className="task"+(t.done?" done":"");
   const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!t.done;cb.setAttribute("aria-label","完成事項");
   cb.onchange=()=>{data.daily[i].done=cb.checked;save()};
   const name=document.createElement("div");name.className="name";name.textContent=t.text;
   el.append(cb,name);
   if(!t.fixed){
     const edit=document.createElement("button");edit.className="icon";edit.textContent="✎";edit.title="編輯";
     edit.onclick=()=>{const v=prompt("修改事項：",t.text);if(v!==null&&v.trim()){data.daily[i].text=v.trim();save()}};
     const del=document.createElement("button");del.className="icon";del.textContent="×";del.title="刪除";
     del.onclick=()=>{if(confirm("確定刪除這個自訂事項？")){data.daily.splice(i,1);save()}};
     el.append(edit,del);
   }
   root.append(el);
 });
}
function render(){
 taskList();
 const done=data.daily.filter(t=>t.done).length,total=data.daily.length;
 document.getElementById("doneStat").textContent=done+" / "+total;
 const bar=document.getElementById("dailyBar");if(bar)bar.style.width=(total?Math.round(done/total*100):0)+"%";
 const pct=document.getElementById("dailyPct");if(pct)pct.textContent="完成 "+(total?Math.round(done/total*100):0)+"% · "+done+"/"+total+" 項";
}
function addTask(){
 const input=document.getElementById("dailyInput"),text=input.value.trim();
 if(!text){input.focus();return}
 data.daily.push({id:id(),text,done:false,fixed:false});input.value="";save();input.focus();
}
document.getElementById("addDaily").onclick=addTask;
document.getElementById("dailyInput").onkeydown=e=>{if(e.key==="Enter")addTask()};
document.getElementById("reset").onclick=()=>{
 if(confirm("將所有每日必做事項取消勾選？不會刪除任務。")){
  data.daily=data.daily.map(t=>({...t,done:false}));data.day=day;save();
 }
};
render();
</script></body></html>
